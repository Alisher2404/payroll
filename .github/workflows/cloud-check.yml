name: Cloud check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-python313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Clean dependency install
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: All tests, including cloud login and demo bootstrap
        run: python -m pytest -q
      - name: Cloud server health
        shell: bash
        run: |
          python -m streamlit run app.py --server.headless=true > /tmp/payroll-streamlit.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/payroll-streamlit.log
          exit 1
